server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Internal monitoring console: never index, never frame, never sniff.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Resolve the Monitoring API through Docker's DNS at request time. With a literal host in
    # proxy_pass, nginx resolves it once at startup and keeps the old IP (502) after the
    # monitoring-api container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Only the dashboard API is forwarded; the Monitoring API's /actuator stays unreachable.
    # X-Real-IP feeds the login rate limiter.
    location /api/monitoring/ {
        set $monitoring_api http://monitoring-api:8090;
        proxy_pass $monitoring_api;
        # $http_host keeps the port (192.168.0.22:3000). $host drops it, so the backend would see a
        # different origin from the browser's, treat the request as cross-origin, and reject it with
        # 403 "Invalid CORS request" for anyone not on localhost.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        return 404;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Client-side routes all serve the SPA shell.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
