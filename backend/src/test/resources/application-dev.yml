# Test-classpath override of the dev profile (tests run under the default `dev` profile).
#
# Exists so the main application-dev.yml can omit a JWT secret default — see the comment there.
# This file shadows it on the test classpath only, so tests get a fixed signing key without a
# usable default ever existing in a deployable artifact. The datasource is supplied by
# Testcontainers via @ServiceConnection, which overrides whatever is configured here.
app:
  jwt:
    secret: test-only-signing-secret-not-used-outside-unit-tests
  # Bootstraps the admin account used by the admin integration tests.
  admin:
    username: test-admin
    password: test-admin-password
  research:
    pseudonym-secret: test-only-pseudonym-secret-not-used-outside-tests
  # Every integration test registers from MockMvc's 127.0.0.1, so the real per-IP limits would
  # trip mid-suite. RateLimitIntegrationTest sets its own small limits to test the filter itself.
  rate-limit:
    register:
      max-requests: 1000000
    refresh:
      max-requests: 1000000
    reset-pin:
      max-requests: 1000000
    recovery-questions:
      max-requests: 1000000
