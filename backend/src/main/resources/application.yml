spring:
  application:
    name: heart-care-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 604800000  # 7 days
  sync:
    max-batch-size: 200  # records per /api/v1/sync call; the client chunks beyond this
