spring:
  application:
    name: heart-care-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080
  # Caps the request line and headers. The JSON body cap is enforced separately below, because
  # Tomcat's max-swallow-size/maxPostSize does not apply to application/json.
  max-http-request-header-size: 16KB

spring.servlet.multipart:
  max-request-size: 2MB

app:
  jwt:
    secret: ${JWT_SECRET}
    # Access-token lifetime. Kept at 7 days until the mobile app ships its refresh interceptor
    # (see BUGS_FIXED.md, Issue 6); then lower to ~1 hour (3600000).
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}  # 7 days
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:5184000000}  # 60 days, rotated on every use
  auth:
    lockout:
      # A 4-digit PIN is 10,000 combinations. Five tries per 15 minutes puts an exhaustive
      # search out of reach without punishing a patient who mistypes.
      max-attempts: 5
      duration-minutes: 15
    recovery:
      # Forgot PIN (security questions). Its own counter: a forgotten PIN is often a locked one.
      max-attempts: 5
      duration-minutes: 60
  admin:
    # Bootstrap account for the read-only admin panel (admin-web/). Created on startup if
    # absent; never overwritten. Leave either unset to skip. Password must be 12+ characters.
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
    jwt-expiration-ms: 28800000  # 8 hours: admin tokens see every patient, so keep them short-lived
  research:
    jwt-expiration-ms: 28800000  # 8 hours; revoke/reset/expiry still cut sessions off immediately
    # HMAC key for patient pseudonyms shown to researchers (P-XXXXXXXX). REQUIRED, 32+ bytes, no
    # default. Changing it re-keys every pseudonym, so researchers' saved notes about a P-id break.
    pseudonym-secret: ${RESEARCH_PSEUDONYM_SECRET}
  cors:
    # Comma-separated. Default is local dev only; production MUST set CORS_ALLOWED_ORIGINS.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}
  rate-limit:
    # Per client IP (see RateLimitFilter). Login has its own per-account PIN lockout above.
    register:
      max-requests: 10
      window-seconds: 3600
    refresh:
      max-requests: 60
      window-seconds: 60
    reset-pin:
      max-requests: 10
      window-seconds: 3600
    recovery-questions:
      max-requests: 30
      window-seconds: 3600
  time:
    # Calendar zone for "today" and date filters when a request carries no X-Timezone header.
    default-zone: ${APP_DEFAULT_ZONE:Africa/Addis_Ababa}
    # Phones run fast; timestamps up to this far ahead of the server clock are not "future".
    max-future-skew-seconds: 300
  sync:
    max-batch-size: 200  # records per /api/v1/sync call; the client chunks beyond this
    # Rejected at the servlet layer before Jackson allocates anything, so an oversized batch
    # cannot exhaust heap before SyncService's record-count check runs.
    max-body-bytes: 2097152  # 2 MB
