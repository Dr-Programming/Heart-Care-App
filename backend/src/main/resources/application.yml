spring:
  application:
    name: heart-care-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080
  # Caps the request line and headers. The JSON body cap is enforced separately below, because
  # Tomcat's max-swallow-size/maxPostSize does not apply to application/json.
  max-http-request-header-size: 16KB

spring.servlet.multipart:
  max-request-size: 2MB

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 604800000  # 7 days
  auth:
    lockout:
      # A 4-digit PIN is 10,000 combinations. Five tries per 15 minutes puts an exhaustive
      # search out of reach without punishing a patient who mistypes.
      max-attempts: 5
      duration-minutes: 15
  admin:
    # Bootstrap account for the read-only admin panel (admin-web/). Created on startup if
    # absent; never overwritten. Leave either unset to skip. Password must be 12+ characters.
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
    jwt-expiration-ms: 28800000  # 8 hours: admin tokens see every patient, so keep them short-lived
  cors:
    # Comma-separated. Default is local dev only; production MUST set CORS_ALLOWED_ORIGINS.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}
  sync:
    max-batch-size: 200  # records per /api/v1/sync call; the client chunks beyond this
    # Rejected at the servlet layer before Jackson allocates anything, so an oversized batch
    # cannot exhaust heap before SyncService's record-count check runs.
    max-body-bytes: 2097152  # 2 MB
