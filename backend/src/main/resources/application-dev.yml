spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/heartcare
    username: ${POSTGRES_USER:heartcare}
    password: ${POSTGRES_PASSWORD:heartcare}

# app.jwt.secret is deliberately NOT defaulted here. This profile is the fallback when
# SPRING_PROFILES_ACTIVE is unset, including on a misconfigured production deploy, so a
# default here would silently sign real tokens with a secret committed to this repo.
# Export JWT_SECRET (see .env.example) before running locally; the app refuses to start without it.
