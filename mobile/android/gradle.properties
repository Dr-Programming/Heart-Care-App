org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental compiler memory-maps its `.tab` caches, and on Windows
# it cannot always release those handles again - the build then dies in
# IncrementalCachesManager.close with "Could not close incremental caches",
# even on a cold build that compiled non-incrementally anyway. Turning the
# feature off skips that code path entirely. Costs a little rebuild time; the
# alternative is a build that fails at random on every Windows machine.
kotlin.incremental=false
