server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Admin pages show patient health data: never index, never frame, never sniff.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Same-origin API: the browser calls /api/..., nginx forwards to the backend container, so
    # no CORS configuration is needed for the admin panel.
    location /api/ {
        proxy_pass http://backend:8080;
        # $http_host keeps the port (192.168.0.22:3000). $host drops it, so the backend would see a
        # different origin from the browser's, treat the request as cross-origin, and reject it with
        # 403 "Invalid CORS request" for anyone not on localhost.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Client-side routes (/patients/123) all serve the SPA shell.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
